[package]
name = "chivava"
version = "0.1.0"
edition = "2024"
description = "A compact, themed touch-typing trainer with Vim-style editing"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fontdue = { version = "0.9.4", default-features = false, features = ["std", "simd"] }
rand = "0.9"
ratatui = "0.29"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "hound"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tree-sitter-highlight = "0.27.0"
tree-sitter-gdscript = "6.1.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
